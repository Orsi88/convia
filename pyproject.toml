[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convia"
version = "0.1.0"
description = "Base analítica do projeto de extensão CONVIA"
requires-python = ">=3.12"
dependencies = ["fastapi==0.121.3", "uvicorn==0.54.0", "openpyxl==3.1.5", "duckdb==2.0.1"]

[project.optional-dependencies]
prep = ["pyreadr==0.5.9", "polars==2.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
convia = ["web/*.html", "web/*.css", "web/*.js", "web/*.png", "web/*.jpg", "web/*.geojson", "web/*.json"]
